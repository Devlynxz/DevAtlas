services:
  - type: web
    name: devatlas-api
    runtime: python
    rootDir: api
    plan: free
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head && python seed_data.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10"
      - key: CORS_ORIGINS
        sync: false
